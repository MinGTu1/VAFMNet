  test_9:
    name: RealSR
    type: PairedImageDataset
    dataroot_gt: D:\Anaconda\envs\datasets\val_images\RealSR\HR
    dataroot_lq: D:\Anaconda\envs\datasets\val_images\RealSR\LR_bicubic
    filename_tmpl: '{}_LR4'
    io_backend:
      type: disk


# network structures
network_g:
  type: VAFMNet_realsr
  dim: 48
  n_blocks: 12
  upscaling_factor: 4

# path
path:
  pretrain_network_g: 
  strict_load_g: true

# validation settings
val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name
  pbar: true
  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 4
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 4
      test_y_channel: true
